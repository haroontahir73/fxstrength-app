# .github/workflows/news-watch.yml
#
# Every ~15 min: scan free news feeds + the economic calendar for dollar / geopolitical
# / Fed / Trump / data-surprise items, work out the likely market reaction (with a live
# price check so the alert leads with what is ACTUALLY happening), and push it to an
# ntfy.sh topic so it lands on the phone. Commits nothing.
#
# Setup: add a repository secret NTFY_TOPIC (Settings -> Secrets and variables -> Actions).
# Without it the job runs and logs what it would have sent, but pushes nothing.
name: news watch

# SCHEDULING NOTE - do not "simplify" this back to a short cron.
# Measured on this repo: a '*/15' cron produced TWO runs in a 7-hour stretch (a 273-min
# hole), and after switching to hourly, the scheduler delivered NOTHING between 09:44 and
# 13:30 - not for this workflow, not for the dashboard one. Scheduled workflows on
# free/public repos are best-effort and are dropped wholesale under load; both workflows
# were "active" the entire time.
#
# So the cron is treated as unreliable by design: each run LOOPS INTERNALLY on a 5-minute
# beat for ~5.5 hours (just under the 6h job ceiling). One trigger landing every few hours
# is then enough for continuous coverage, which matches the worst gap actually observed.
# The concurrency group serialises overlapping runs, so extra triggers are harmless.
on:
  schedule:
    - cron: '7,37 * * * *'      # twice an hour; extras just replace the pending run
  workflow_dispatch:
  # A code change has to RESTART the watcher, not wait for it. The loop now runs for
  # 5.5 hours, so without this a fix to the classifier or the decode table sits unused
  # for most of a day while the old copy keeps alerting - which is exactly what happened
  # to the FX playbook correction. cancel-in-progress lets the new run take over at once.
  # engine/data/** is excluded because the loop commits the feed there on every alert;
  # GITHUB_TOKEN pushes do not trigger workflows anyway, but this makes it explicit.
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '!engine/data/**'
      - '.github/workflows/news-watch.yml'

permissions:
  contents: write          # the loop commits the feed file when a new alert lands

concurrency:
  group: news-watch
  # Cancel ONLY for a deploy. This is what keeps coverage continuous:
  #   push     -> the new code takes over at once (a stale classifier is worse than a gap)
  #   schedule -> QUEUES behind the healthy run instead of killing it, and starts the
  #               moment the 5.5h loop ends. With an hourly cron there is essentially
  #               always one run pending, so the handover is seamless even when GitHub
  #               drops most of the scheduled triggers - which it does.
  # With cancel-in-progress: true on every event, a cron would have restarted a healthy
  # watcher every hour, and worse, nothing would have been queued to take over when the
  # loop ended on its own.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # THE GATE. The watcher classifies headlines and buzzes the phone, and it commits the
  # feed back to the repo, so it is a deploy in every sense that matters. It waits.
  #
  # The tradeoff is deliberate and matches this file's own rule that "a stale classifier
  # is worse than a gap": if the suites fail, the watcher does not run and no alerts go
  # out, rather than a broken decoder sending calls that point the wrong way. A failing
  # gate therefore costs coverage - fix the test, do not route around it.
  tests:
    uses: ./.github/workflows/tests.yml

  watch:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore dedup cache
        uses: actions/cache/restore@v4
        with:
          path: engine/data/news_seen.json
          key: news-seen-${{ github.run_id }}
          restore-keys: news-seen-

      - name: Restore commodity watcher state
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/data/commodity_seen.json
            engine/data/commodity_feed.json
            engine/data/theme_claims.json
            engine/data/alert_scores.json
            engine/data/decode_overrides.json
            engine/data/alert_queue.json
            engine/data/override_history.json
          key: commodity-state-${{ github.run_id }}
          restore-keys: commodity-state-

      # publish_state.py's bookkeeping gets a cache of its OWN on purpose. actions/cache
      # versions an entry by its exact path list, so adding a file to the state cache
      # above would make the next run miss that cache entirely and start from the last
      # committed state - which is exactly what happened on the first run after PR #1
      # ("Cache not found for input keys: commodity-state-..."). Leave that list alone.
      - name: Restore publish status
        uses: actions/cache/restore@v4
        with:
          path: engine/data/publish_status.json
          key: publish-status-${{ github.run_id }}
          restore-keys: publish-status-

      # The restored cache can be OLDER than main: a run cancelled by a deploy never saves
      # it, but may already have published. Merge main's copy of the watcher state in
      # BEFORE the first pass, so stories already alerted on stay seen (no duplicate
      # phone alert) and nothing already published is dropped. Data files only - the
      # code in the working tree stays exactly the commit the test gate passed.
      - name: Merge newer watcher state from main
        continue-on-error: true        # not fatal: every publish merges main in anyway
        working-directory: engine
        run: python publish_state.py --sync-in

      # Scan every 5 minutes for ~55 minutes, then let the next hourly run take over.
      # Each watcher keeps its own dedup file on disk, so a story seen in one pass is
      # not re-sent in the next. A crash in one watcher must not stop the other, or
      # stop the loop - hence the "|| true" on each.
      # Silent (min-priority) proof that the secret is wired and the run really started.
      - name: Ping the phone that the watcher is up
        continue-on-error: true        # a missing secret must not stop the watcher
        working-directory: engine
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python commodity_watch.py --ping

      - name: Watch (3-minute beat for ~5.5 hours)
        working-directory: engine
        timeout-minutes: 340
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 330*60 ))
          PASS=1
          while :; do
            echo "::group::pass $PASS  $(date -u +%H:%M:%S)Z"
            # COMMODITY FIRST, deliberately. The two watchers claim a shared theme
            # (news_watch.theme_claim) so one event cannot buzz the phone twice, and
            # whoever runs first wins the claim. The gold/silver/oil decode is the
            # format that was asked for, so it gets first refusal; the FX watcher
            # still fires on themes the decoder ignored (tariffs, BoJ, majors).
            python commodity_watch.py || true
            python news_watch.py      || true
            # Every 10th pass (~30 min): mark past calls against the tape, downgrade
            # whatever is measurably not working, and report any health problem.
            if [ $(( PASS % 10 )) -eq 1 ]; then
              python selfcheck.py || true
            fi
            # Every 80th pass (~4h): audit the whole system unattended. It pushes ONLY
            # when it finds a problem - an audit that says "all clear" four times a day
            # trains you to ignore it, so silence means healthy.
            if [ $(( PASS % 80 )) -eq 5 ]; then
              python audit.py --quick --notify || true
            fi
            # Publish the feed as soon as an alert lands, not when the job ends. The
            # cache is only written in the post-job step, so without this the phone
            # gets an alert up to ~55 min before the dashboard shows it. The dedup
            # state rides along, so a deploy that cancels this run cannot reset it.
            #
            # NO REBASE. This used to commit on the checked-out SHA and `pull --rebase`.
            # A scheduled run gets the SHA from when it was CREATED, which can be an hour
            # before it starts; if the previous loop pushed in that gap, the first
            # commit conflicted on the data files, the rebase aborted, and no feed
            # update reached main for the whole run (run 38081932047, 2026-10-10).
            # publish_state.py instead builds each commit on main's CURRENT tip,
            # replacing only the watcher's own files after merging them field by field,
            # and retries from a fresh fetch if main moves. It exits at once, with no
            # network, on a pass where the feed did not change.
            python publish_state.py || true
            echo "::endgroup::"
            PASS=$(( PASS + 1 ))
            [ $(( $(date +%s) + 180 )) -lt $END ] || break
            sleep 180
          done
          echo "loop finished after $PASS pass(es)"
          # One last attempt - and a RED run if the feed still has not reached main.
          # A green run with a frozen dashboard feed is how the 5.5h stall went unseen.
          # The cache-save steps below are `if: always()`, so the state is kept either way.
          python publish_state.py --final

      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/data/news_seen.json
          key: news-seen-${{ github.run_id }}

      # The feed file is what the dashboard job picks up to render the in-app news list.
      - name: Save commodity watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            engine/data/commodity_seen.json
            engine/data/commodity_feed.json
            engine/data/theme_claims.json
            engine/data/alert_scores.json
            engine/data/decode_overrides.json
            engine/data/alert_queue.json
            engine/data/override_history.json
          key: commodity-state-${{ github.run_id }}

      - name: Save publish status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/data/publish_status.json
          key: publish-status-${{ github.run_id }}
