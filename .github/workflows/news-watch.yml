# .github/workflows/news-watch.yml
#
# Every ~15 min: scan free news feeds + the economic calendar for dollar / geopolitical
# / Fed / Trump / data-surprise items, work out the likely market reaction (with a live
# price check so the alert leads with what is ACTUALLY happening), and push it to an
# ntfy.sh topic so it lands on the phone. Commits nothing.
#
# Setup: add a repository secret NTFY_TOPIC (Settings -> Secrets and variables -> Actions).
# Without it the job runs and logs what it would have sent, but pushes nothing.
name: news watch

# SCHEDULING NOTE - do not "simplify" this back to a short cron.
# Measured on this repo: a '*/15' cron produced TWO runs in a 7-hour stretch (a 273-min
# hole), and after switching to hourly, the scheduler delivered NOTHING between 09:44 and
# 13:30 - not for this workflow, not for the dashboard one. Scheduled workflows on
# free/public repos are best-effort and are dropped wholesale under load; both workflows
# were "active" the entire time.
#
# So the cron is treated as unreliable by design: each run LOOPS INTERNALLY on a 5-minute
# beat for ~5.5 hours (just under the 6h job ceiling). One trigger landing every few hours
# is then enough for continuous coverage, which matches the worst gap actually observed.
# The concurrency group serialises overlapping runs, so extra triggers are harmless.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  # lets a change to this file start a run immediately, which is also how the ntfy
  # secret gets verified without waiting on the scheduler
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-watch.yml'

permissions:
  contents: write          # the loop commits the feed file when a new alert lands

concurrency:
  group: news-watch
  # the loop now runs for 5.5h, so a queued run would otherwise wait most of a day.
  # newest code wins; the feed is committed mid-loop so a cancel loses nothing but the
  # dedup cache, worth at most a couple of repeat alerts.
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore dedup cache
        uses: actions/cache/restore@v4
        with:
          path: engine/data/news_seen.json
          key: news-seen-${{ github.run_id }}
          restore-keys: news-seen-

      - name: Restore commodity watcher state
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/data/commodity_seen.json
            engine/data/commodity_feed.json
          key: commodity-state-${{ github.run_id }}
          restore-keys: commodity-state-

      # Scan every 5 minutes for ~55 minutes, then let the next hourly run take over.
      # Each watcher keeps its own dedup file on disk, so a story seen in one pass is
      # not re-sent in the next. A crash in one watcher must not stop the other, or
      # stop the loop - hence the "|| true" on each.
      # Silent (min-priority) proof that the secret is wired and the run really started.
      - name: Ping the phone that the watcher is up
        continue-on-error: true        # a missing secret must not stop the watcher
        working-directory: engine
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python commodity_watch.py --ping

      - name: Watch (5-minute beat for ~5.5 hours)
        working-directory: engine
        timeout-minutes: 340
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 330*60 ))
          PASS=1
          while :; do
            echo "::group::pass $PASS  $(date -u +%H:%M:%S)Z"
            python news_watch.py      || true
            python commodity_watch.py || true
            # Publish the feed as soon as an alert lands, not when the job ends. The
            # cache is only written in the post-job step, so without this the phone
            # gets an alert up to ~55 min before the dashboard shows it.
            if ! git diff --quiet -- data/commodity_feed.json; then
              git add data/commodity_feed.json
              git commit -m "feed: new commodity alert(s) [skip refresh]" || true
              git push || echo "  push failed - the cache still carries the feed"
            fi
            echo "::endgroup::"
            PASS=$(( PASS + 1 ))
            [ $(( $(date +%s) + 300 )) -lt $END ] || break
            sleep 300
          done
          echo "loop finished after $PASS pass(es)"

      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/data/news_seen.json
          key: news-seen-${{ github.run_id }}

      # The feed file is what the dashboard job picks up to render the in-app news list.
      - name: Save commodity watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            engine/data/commodity_seen.json
            engine/data/commodity_feed.json
          key: commodity-state-${{ github.run_id }}
