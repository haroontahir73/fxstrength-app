name: econ calendar live smoke

on:
  pull_request:
    paths:
      - 'engine/econ_cal.py'
      - 'engine/econ_cal_public.py'
      - 'engine/econ_smoke_check.py'
      - '.github/workflows/econ-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live build against official sources (read-only)
        working-directory: engine
        run: python econ_smoke_check.py
