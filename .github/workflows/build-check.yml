# .github/workflows/build-check.yml
#
# A FULL dashboard build of the proposed change, with real data, before it can reach
# production - so a merge is never the first time the whole page is built.
#
# Isolated on purpose:
#   * starts from the committed state only - no Actions cache restored or saved, so it runs
#     the same path an empty production cache would: run.py bootstrap (deep LF/MM history),
#     the one-time ~4-year CFTC Legacy backfill, every add-on, build_dashboard, then the
#     pages / flagship / OI render steps exactly as refresh.yml runs them;
#   * read-only token, notifier variables pinned empty, and the run is wrapped so any
#     attempt to reach ntfy or Telegram is blocked AND fails the job. The only secrets are
#     the Myfxbook login (one real Community Outlook fetch, so the Retail tab is tested on
#     real data before merge); a scan below fails the job if either value appears in any
#     built file. GitHub does not pass secrets to pull requests from forks;
#   * deploys nothing, commits nothing, writes no production cache.
# Then it verifies the result: check_build.py re-derives every COT table/report figure and
# colour from the stored CFTC rows; check_layout.py drives the page at desktop and phone
# size. The built page, the CFTC store and screenshots are kept as the run's artifact.
name: build check

on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'update.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: full build (real data, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NTFY_TOPIC: ''
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      FRED_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Full pipeline from an empty state (notifications blocked)
        working-directory: engine
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: |
          cat > /tmp/guarded_run.py <<'PY'
          import os, sys, runpy, urllib.request
          sys.path.insert(0, os.getcwd())
          real, hits = urllib.request.urlopen, []
          def guard(req, *a, **k):
              url = req if isinstance(req, str) else getattr(req, "full_url", str(req))
              if "ntfy" in url.lower() or "telegram" in url.lower():
                  hits.append(url)
                  raise OSError("blocked: the build check never notifies")
              return real(req, *a, **k)
          urllib.request.urlopen = guard
          sys.argv = ["run.py"] + sys.argv[1:]
          code = 0
          try:
              runpy.run_path("run.py", run_name="__main__")
          except SystemExit as e:
              code = e.code or 0
          print(f"notification attempts blocked: {len(hits)}")
          sys.exit(3 if hits else code)
          PY
          python /tmp/guarded_run.py bootstrap

      # The durable history archive (a PRIVATE repo): prove the token can write there, with
      # one no-data file. The pipeline step above deliberately has no archive token, so a
      # pull-request build never writes into the real history.
      - name: Myfxbook history archive - private and writable (no data written)
        working-directory: engine
        env:
          MYFXBOOK_HISTORY_TOKEN: ${{ secrets.MYFXBOOK_HISTORY_TOKEN }}
          MYFXBOOK_HISTORY_REPO: ${{ vars.MYFXBOOK_HISTORY_REPO }}
        run: |
          python - <<'PY'
          import myfxbook, sys
          a = myfxbook.archive(verify_only=True)
          sys.exit(1 if a.get("configured") and a.get("last_error") else 0)
          PY

      - name: Add the MACRO / MICRO / OI pages
        working-directory: engine
        continue-on-error: true
        run: python pages.py dashboard.html

      - name: Add the flagship score card
        working-directory: engine
        continue-on-error: true
        run: python flagship.py dashboard.html

      - name: Open interest page
        working-directory: engine
        continue-on-error: true
        run: python oi.py --render-only dashboard.html

      - name: Verify COT tables + all 16 reports against the CFTC data
        working-directory: engine
        run: python check_build.py dashboard.html --data data --require-history 200

      - name: Install a headless browser for the layout check
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      # Desktop, narrow window, then two real-phone runs (mobile emulation, touch, real taps):
      # a phone browser opening dashboard.html, and the Android app's wrapper around it.
      - name: Desktop + phone layout check and screenshots
        working-directory: engine
        run: python check_layout.py dashboard.html --out ../build-check

      # Before/after only (never fails the build): the same real-phone checks against the
      # page currently live, so a change to phone rendering shows up side by side.
      - name: Real-phone checks on the live page (before)
        working-directory: engine
        continue-on-error: true
        run: |
          curl -fsS -o /tmp/live.html https://haroontahir73.github.io/fxstrength-app/dashboard.html
          python check_layout.py /tmp/live.html --device-only --out ../build-check/live-before

      # Measurement only (never fails the build): this page vs the live one on an emulated
      # mid-range phone - size, download, first paint, load, long tasks, and how fast
      # opening the COT tab / a report / tapping a figure reaches the screen.
      - name: Phone loading + interaction (this build vs live)
        working-directory: engine
        continue-on-error: true
        run: python measure_phone.py dashboard.html --baseline https://haroontahir73.github.io/fxstrength-app/dashboard.html --ab-closed-layout --runs 3 --out ../build-check

      - name: Keep the built page, the CFTC store and the screenshots
        if: always()
        run: |
          mkdir -p build-check
          cp engine/dashboard.html build-check/ 2>/dev/null || true
          cp engine/data/cot_legacy.json build-check/ 2>/dev/null || true
          cp engine/data/myfxbook.json build-check/ 2>/dev/null || true

      # The Myfxbook login must never reach a built or stored file. Reads the two secrets
      # from the environment, never prints them; lists only the offending file names.
      - name: No Myfxbook credential in any built or stored file
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          MYFXBOOK_HISTORY_TOKEN: ${{ secrets.MYFXBOOK_HISTORY_TOKEN }}
        if: always()
        run: |
          python - <<'PY'
          import os, sys, urllib.parse
          from pathlib import Path
          vals = [v for v in (os.environ.get("MYFXBOOK_EMAIL"), os.environ.get("MYFXBOOK_PASSWORD"),
                              os.environ.get("MYFXBOOK_HISTORY_TOKEN")) if v]
          if not vals:
              print("Myfxbook secrets not set - nothing to scan for"); sys.exit(0)
          forms = {f for v in vals for f in (v, urllib.parse.quote(v, safe=""), urllib.parse.quote_plus(v))}
          hits = [str(p) for root in ("engine", "pi", ".github", "build-check") for p in Path(root).rglob("*")
                  if p.is_file() and any(f.encode() in p.read_bytes() for f in forms)]
          print(f"scanned; {len(hits)} file(s) contain a Myfxbook credential")
          for h in hits:
              print("  !!", h)
          sys.exit(1 if hits else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-check
          path: build-check
          # 1 day: once the Myfxbook secrets exist this artifact holds REAL Myfxbook figures,
          # and a public repo's artifacts are downloadable by any signed-in GitHub user. Kept
          # only long enough to verify the run, until public display is cleared with Myfxbook.
          retention-days: 1
