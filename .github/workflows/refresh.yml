# .github/workflows/refresh.yml
#
# Runs the FX Strength Desk pipeline on GitHub's servers and deploys the dashboard to Pages.
# No PC involved. Commits nothing - the page is published via the Pages deployment API.
name: refresh dashboard

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'index.html'
      - 'update.json'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'pipeline mode'
        default: 'auto'
        type: choice
        options: [auto, daily, cot, bootstrap]
      cot_legacy_fetch:
        # Set by the Raspberry Pi checker (pi/cot_pi_check.py) when it sees a new CFTC
        # report: fetch the Legacy COT report in this run instead of waiting for the
        # schedule-based poll. Everything else in the run is unchanged.
        description: 'fetch the CFTC Legacy COT report now (Pi trigger)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  # THE GATE. Runs inside this same run, at this same commit, and the deploy below
  # cannot start until it passes - so a scheduled refresh can never publish code whose
  # tests failed. Applies to workflow_dispatch too: there is no path to Pages that
  # skips this job.
  tests:
    uses: ./.github/workflows/tests.yml

  refresh:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pipeline state cache
        uses: actions/cache/restore@v4
        with:
          path: engine/data
          key: fxstrength-state-${{ github.run_id }}
          restore-keys: fxstrength-state-

      # commodity_feed.json is committed by the news-watch loop the moment an alert
      # fires, so the checkout is always at least as fresh as the restored engine/data
      # cache. Pin it too, or an older cached copy silently wins.
      - name: Pin committed override files
        run: |
          git checkout -- \
            engine/data/fundamentals_manual.json \
            engine/data/commodities_manual.json \
            engine/data/rate_expectations_manual.json \
            engine/data/speech_tone.json \
            engine/data/commodity_feed.json \
            engine/data/indices_manual.json \
            engine/data/oi_history.json

      - name: Choose mode
        id: mode
        run: |
          req='${{ github.event.inputs.mode }}'
          if [ -n "$req" ] && [ "$req" != "auto" ]; then
            echo "mode=$req" >> "$GITHUB_OUTPUT"
          elif [ ! -f engine/data/cot.json ]; then
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "6" ]; then
            echo "mode=cot" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (${{ steps.mode.outputs.mode }})
        working-directory: engine
        # FRED_API_KEY is optional: fred.py writes a "no key" file and the panel hides itself,
        # so the pipeline is unaffected until the secret exists. Add it at
        # Settings > Secrets and variables > Actions > New repository secret.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Myfxbook Community Outlook login (myfxbook.py). Used only inside this step, in one
          # process: login -> outlook -> logout on this runner's IP. Never printed or stored.
          # OFF unless the repository variable MYFXBOOK_ENABLED is exactly "true": no login,
          # no fetch, no archive write, no Myfxbook figure on the page - and while off the
          # Myfxbook secrets are not even handed to this step.
          MYFXBOOK_ENABLED: ${{ vars.MYFXBOOK_ENABLED }}
          MYFXBOOK_EMAIL: ${{ vars.MYFXBOOK_ENABLED == 'true' && secrets.MYFXBOOK_EMAIL || '' }}
          MYFXBOOK_PASSWORD: ${{ vars.MYFXBOOK_ENABLED == 'true' && secrets.MYFXBOOK_PASSWORD || '' }}
          # Durable Myfxbook history: fine-grained token for the PRIVATE archive repo only
          # (Contents: read and write). myfxbook.archive() writes day files every 6 h.
          MYFXBOOK_HISTORY_TOKEN: ${{ vars.MYFXBOOK_ENABLED == 'true' && secrets.MYFXBOOK_HISTORY_TOKEN || '' }}
          MYFXBOOK_HISTORY_REPO: ${{ vars.MYFXBOOK_HISTORY_REPO }}
          # Manual reset of the Myfxbook login lock (2 rejected logins stop all logins). After
          # fixing the credentials, set this repository variable to the lock time printed in
          # the refresh log (e.g. 2026-10-14T09:00:00Z). It clears that one lock only.
          MYFXBOOK_LOGIN_RESET: ${{ vars.MYFXBOOK_LOGIN_RESET }}
          # The production source: its archive push also syncs the shared request ledger
          # (all real Myfxbook requests, production + manual, against one 100/24 h budget).
          MYFXBOOK_SOURCE: production
          COT_LEGACY_FETCH: ${{ github.event.inputs.cot_legacy_fetch == 'true' && '1' || '' }}
        run: python run.py ${{ steps.mode.outputs.mode }}

      # Options Futures-Equivalent OI (PR #12): the weekly delta-adjusted options-exposure
      # series, rebuilt from the CFTC Commitments of Traders reports (futures-only vs combined).
      # DATA ONLY in this PR - it writes engine/data/options_fe_oi.json for the PR #13 UI and
      # renders nothing yet. continue-on-error so a CFTC hiccup can never take the deploy down
      # (reliability: it fails independently of COT / Myfxbook / scanner / backtest). It reaches
      # ONLY publicreporting.cftc.gov - no CME, no Myfxbook, no credentials, its own requests.
      - name: Options futures-equivalent OI data
        working-directory: engine
        continue-on-error: true
        run: python options_oi.py

      # Injects the decoded gold/silver/oil alerts into dashboard.html between markers.
      # Self-contained - it never touches anything build_dashboard.py owns.
      # Now also renders the OI tab (it imports oi.py), so it has a dependency it did not
      # have before. This step sits between "Run pipeline" and "Assemble the site", so a
      # non-zero exit here would take the whole Pages deploy down - a missing tab is far
      # better than no dashboard.
      - name: Add the MACRO / MICRO / OI pages
        working-directory: engine
        continue-on-error: true
        run: python pages.py dashboard.html

      # A per-currency score from ONLY the big scheduled releases (NFP, CPI, FOMC, GDP,
      # PMI, jobs, retail). Reads calendar.json, injects its own card between markers.
      # continue-on-error: a bad calendar row must not be able to take the whole page down.
      - name: Add the flagship score card
        working-directory: engine
        continue-on-error: true
        run: python flagship.py dashboard.html

      # Standalone open-interest.html from the CFTC options-FE archive (oi_public.py, PR #13).
      # The in-dashboard OI tab is rendered CFTC-sourced inside build_dashboard.oi_panel().
      # continue-on-error so a missing archive (e.g. the options-FE step above hiccuped) only
      # costs the standalone page, never the deploy. The old CME path (oi.py / oi_history.json)
      # is retired from the public page and kept dormant pending removal in a follow-up PR.
      - name: Open interest page (CFTC)
        working-directory: engine
        continue-on-error: true
        run: python oi_public.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp engine/dashboard.html _site/dashboard.html
          cp engine/commodity-news.html _site/commodity-news.html 2>/dev/null || true
          cp engine/open-interest.html  _site/open-interest.html  2>/dev/null || true
          cp index.html            _site/index.html
          cp update.json           _site/update.json
          cp FXStrengthDesk-*.apk  _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Save pipeline state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: engine/data
          key: fxstrength-state-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
