# .github/workflows/refresh.yml
#
# Runs the FX Strength Desk pipeline on GitHub's servers and deploys the dashboard to Pages.
# No PC involved. Commits nothing - the page is published via the Pages deployment API.
name: refresh dashboard

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'index.html'
      - 'update.json'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'pipeline mode'
        default: 'auto'
        type: choice
        options: [auto, daily, cot, bootstrap]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore pipeline state cache
        uses: actions/cache/restore@v4
        with:
          path: engine/data
          key: fxstrength-state-${{ github.run_id }}
          restore-keys: fxstrength-state-

      # commodity_feed.json is committed by the news-watch loop the moment an alert
      # fires, so the checkout is always at least as fresh as the restored engine/data
      # cache. Pin it too, or an older cached copy silently wins.
      - name: Pin committed override files
        run: |
          git checkout -- \
            engine/data/fundamentals_manual.json \
            engine/data/commodities_manual.json \
            engine/data/rate_expectations_manual.json \
            engine/data/speech_tone.json \
            engine/data/commodity_feed.json \
            engine/data/oi_history.json

      - name: Choose mode
        id: mode
        run: |
          req='${{ github.event.inputs.mode }}'
          if [ -n "$req" ] && [ "$req" != "auto" ]; then
            echo "mode=$req" >> "$GITHUB_OUTPUT"
          elif [ ! -f engine/data/cot.json ]; then
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "6" ]; then
            echo "mode=cot" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (${{ steps.mode.outputs.mode }})
        working-directory: engine
        run: python run.py ${{ steps.mode.outputs.mode }}

      # Injects the decoded gold/silver/oil alerts into dashboard.html between markers.
      # Self-contained - it never touches anything build_dashboard.py owns.
      # Now also renders the OI tab (it imports oi.py), so it has a dependency it did not
      # have before. This step sits between "Run pipeline" and "Assemble the site", so a
      # non-zero exit here would take the whole Pages deploy down - a missing tab is far
      # better than no dashboard.
      - name: Add the MACRO / MICRO / OI pages
        working-directory: engine
        continue-on-error: true
        run: python pages.py dashboard.html

      # A per-currency score from ONLY the big scheduled releases (NFP, CPI, FOMC, GDP,
      # PMI, jobs, retail). Reads calendar.json, injects its own card between markers.
      # continue-on-error: a bad calendar row must not be able to take the whole page down.
      - name: Add the flagship score card
        working-directory: engine
        continue-on-error: true
        run: python flagship.py dashboard.html

      # Daily futures open interest -> its own page + a summary strip on the desk.
      # oi.py decides for itself whether a retry window is open (pre-London / mid-London /
      # New York), so running it every pass is cheap and it will not hammer the source.
      # RENDER ONLY - never fetch from here. Proven 2026-09-04 (oi-cloud.yml): CME cuts the
      # connection to this runner outright, so a fetch attempt is guaranteed to fail. Letting
      # it try anyway was ~12 pointless blocked requests a day at a host that rate-limits us.
      # The data is captured on the PC by the oi-daily task and arrives via sync_cloud.py.
      - name: Open interest page
        working-directory: engine
        continue-on-error: true
        run: python oi.py --render-only dashboard.html

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp engine/dashboard.html _site/dashboard.html
          cp engine/commodity-news.html _site/commodity-news.html 2>/dev/null || true
          cp engine/open-interest.html  _site/open-interest.html  2>/dev/null || true
          cp index.html            _site/index.html
          cp update.json           _site/update.json
          cp FXStrengthDesk-*.apk  _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Save pipeline state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: engine/data
          key: fxstrength-state-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
